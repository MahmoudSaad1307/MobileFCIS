    <script>
        const ALL_DATA = {"course": {"code": "FNI-421", "name": "Mobile Computing", "instructors": "Dr. Soha Hussein & Prof. Mohamed Hashim", "institution": "FCIS — Ain Shams University", "term": "Fall 2025 / 2026"}, "lectures": [{"meta": {"id": 1, "title": "Introduction to Mobile Computing & Android Architecture", "subtitle": "Electromagnetic foundations, cellular generations (1G-5G), and the Android OS software stack", "icon": "📱", "color": "cyan"}, "summary": [{"type": "definition", "heading": "What is Mobile Computing?", "body": "Mobile Computing is a technology paradigm that enables the transmission of data, voice, and video via a computer or any other wireless-enabled device without having to be connected to a fixed physical link. It rests on three core pillars: Mobile Communication (wireless networking infrastructure, protocols, and frequency bands), Mobile Hardware (portable devices, sensors, processors, and batteries), and Mobile Software (operating systems like Android/iOS, runtime environments, and mobile applications)."}, {"type": "list", "heading": "Pioneers of Wireless & Electromagnetic Communications", "bullets": ["James Clerk Maxwell (1864): Formulated the classical theory of electromagnetic radiation, mathematically proving that electric and magnetic fields travel through space as waves at the speed of light.", "Heinrich Hertz (1887): Experimentally verified Maxwell's theory by generating and detecting electromagnetic waves in the laboratory, proving radio waves exist.", "Guglielmo Marconi (1895-1901): Pioneered long-distance radio transmission and sent the first transatlantic wireless radio signal, establishing commercial wireless telegraphy.", "Sir Oliver Lodge & Jagadish Chandra Bose: Investigated millimeter radio waves and coherer detectors for wireless signaling.", "Reginald Fessenden (1906): Achieved the first audio transmission of speech and music over radio waves using continuous amplitude modulation."]}, {"type": "comparison", "heading": "Evolution of Cellular Network Generations (1G to 5G)", "table": {"headers": ["Generation", "Primary Technology", "Data Rate", "Key Capabilities & Core Standards", "Limitation"], "rows": [["1G (1980s)", "Analog cellular (FDMA)", "Up to 2.4 kbps", "Voice calls only; AMPS (Advanced Mobile Phone System), NMT", "No encryption, vulnerable to eavesdropping, poor voice quality, no data"], ["2G (1990s)", "Digital cellular (TDMA / CDMA)", "Up to 64 kbps (GPRS 114k, EDGE 384k)", "Digital voice, SMS text messaging, basic mobile data; GSM standard, SIM cards", "Very slow browsing speeds, circuit-switched architecture bottlenecks"], ["3G (2000s)", "Wideband CDMA (WCDMA / UMTS)", "384 kbps to 21 Mbps (HSPA+)", "Mobile broadband, video calls, GPS location services, early smartphone web", "High battery consumption, expensive infrastructure, limited video streaming"], ["4G (2010s)", "All-IP packet switching (OFDMA / LTE)", "100 Mbps to 1 Gbps (LTE-Advanced)", "High-definition streaming, mobile gaming, VoIP, VoLTE, low latency (<50ms)", "Spectrum congestion, high device complexity, limited massive-IoT scalability"], ["5G (2020s)", "Millimeter Wave, Massive MIMO, OFDM", "1 Gbps to 20+ Gbps", "eMBB (enhanced mobile broadband), URLLC (<1ms ultra-reliable latency), mMTC (massive machine-type IoT)", "Higher carrier frequencies have short propagation range and high obstacle absorption"]]}}, {"type": "steps", "heading": "The 5-Layer Android Software Stack Architecture", "steps": [{"label": "Layer 1: Linux Kernel", "text": "The foundation of Android. Provides low-level memory management, process management, security model (UID isolation), power management, and hardware device drivers (Display, Camera, Bluetooth, Wi-Fi, Audio)."}, {"label": "Layer 2: Hardware Abstraction Layer (HAL)", "text": "Defines standard interfaces that expose device hardware capabilities to the higher-level Java API framework. Implemented as modular C/C++ shared libraries (.so) loaded dynamically by system services when hardware is requested."}, {"label": "Layer 3: Android Runtime (ART) & Native C/C++ Libraries", "text": "Executes DEX bytecode. ART features Ahead-Of-Time (AOT) and Just-In-Time (JIT) compilation with profile-guided optimization. Accompanied by core native C/C++ libraries (WebKit/Blink, OpenGL ES, FreeType, SQLite, Bionic libc)."}, {"label": "Layer 4: Java API Framework", "text": "The entire feature-set of Android available to developers through modular services: Activity Manager, Window Manager, Content Providers, View System, Notification Manager, Package Manager, and Telephony Manager."}, {"label": "Layer 5: System & User Applications", "text": "The top layer comprising system apps (Dialer, SMS, Camera, Settings, Browser) and third-party user apps. System apps enjoy no privileged API access that cannot be accessed by third-party apps with proper user permissions."}]}, {"type": "rule", "heading": "Hardware Access Execution Path Rule", "body": "An Android application NEVER communicates directly with the Linux kernel drivers or the HAL. When an app requests hardware access (e.g., opening the camera), it invokes a Java API Framework method (e.g., CameraManager.openCamera). The framework API communicates via IPC/Binder with a System Service running in the system server process. The System Service validates permissions, obtains the corresponding HAL module interface, and the HAL communicates with the Linux kernel driver via ioctl/sysfs."}, {"type": "comparison", "heading": "Dalvik VM vs Android Runtime (ART) vs Modern Toolchain", "table": {"headers": ["Feature", "Dalvik Virtual Machine (Legacy)", "Android Runtime (ART - Modern)", "Modern Toolchain (d8 / R8)"], "rows": [["Execution Model", "Just-In-Time (JIT) compilation", "AOT compilation + JIT + Profile-guided PGO", "Compiles Java/Kotlin bytecode directly to optimized DEX"], ["Installation Speed", "Fast (bytecode stored uncompiled)", "Slower initially (pre-compiles into native ELF machine code)", "Fast build times, smaller APK size through tree-shaking"], ["Runtime Performance", "Higher CPU usage, slower execution", "Faster app startup, reduced CPU overhead, longer battery life", "Optimized register allocation and dead-code elimination"], ["Memory Footprint", "Smaller app footprint on disk", "Larger binary size on disk due to native AOT code", "Reduces 64K method index pressure, optimizes multidex"], ["Garbage Collection", "Frequent GC pauses causing frame drops", "Optimized concurrent GC with single-pause compaction", "Reduces object allocations at compile time"]]}}, {"type": "code", "heading": "Android Compilation Pipeline: Source to DEX", "lang": "kotlin", "code": "// 1. Source Code (.kt or .java)\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n    }\n}\n\n// 2. Compilation (kotlinc / javac) -> Java Bytecode (.class files)\n// 3. Desugaring & Dexing (d8 / R8 compiler) -> Dalvik Executable (classes.dex)\n// 4. Packaging (AAPT2 & APK Builder) -> APK / AAB package\n// 5. Target Device Execution -> ART loads classes.dex, executes AOT/JIT native code", "explanation": "Android applications are authored in Kotlin/Java, compiled to standard JVM bytecode (.class), then converted into register-based Dalvik Executable bytecode (.dex) by the d8/R8 compiler. The register-based architecture of DEX uses fewer instructions and less memory than the stack-based JVM."}], "memoryAids": [{"title": "Hardware Access Path: F-S-H-K", "content": "Framework API -> System Service (via Binder IPC) -> Hardware Abstraction Layer (HAL) -> Kernel Driver. Never direct app-to-HAL or app-to-kernel!"}, {"title": "The 5-Layer Stack Mnemonic: L-H-A-F-A", "content": "L = Linux Kernel (bottom)\nH = HAL (Hardware Abstraction Layer)\nA = ART / Native C/C++ Libraries\nF = Framework (Java APIs & System Services)\nA = Applications (top layer: System & User apps)"}, {"title": "Golden Rules of Android Architecture", "content": "Rule 1: System apps use the exact same Java API framework available to third-party developers.\nRule 2: ART executes DEX bytecode, never the Linux kernel directly.\nRule 3: Dalvik was stack-neutral register-based JIT; ART is hybrid AOT + JIT with profile-guided optimization."}], "mcqs": [{"id": "L1Q1", "q": "When an Android app requests access to hardware (e.g., camera), which of the following best describes the path of execution?", "options": ["The app calls the HAL directly, bypassing system services for efficiency.", "The app uses framework APIs, which communicate with system services that interact with the HAL.", "The app uses native C/C++ libraries, which load the HAL module automatically.", "The app communicates with the kernel directly through system calls, without involving HAL."], "ans": 1, "explanation": "Official Midterm Question 1. Android enforces a secure sandbox: apps call Java API framework classes (e.g., CameraManager), which invoke system services via Binder IPC. System services verify user permissions and communicate with the corresponding HAL module, which then issues kernel system calls."}, {"id": "L1Q2", "q": "Which of the following is NOT true about Android Runtime (ART) and the Dalvik Executable (DEX) format?", "options": ["ART is capable of running multiple virtual machines on low-memory devices.", "DEX is a bytecode format specifically optimized for Android's memory constraints.", "Build tools such as d8 compile Java sources directly into DEX bytecode.", "DEX bytecode can only be executed on the Linux kernel without ART."], "ans": 3, "explanation": "Official Midterm Question 8. The Linux kernel does not execute DEX bytecode directly; it only manages processes, memory, and drivers. DEX bytecode requires a virtual machine/runtime environment (ART or Dalvik) to be translated into machine instructions."}, {"id": "L1Q3", "q": "Which of the following accurately describes the relationship between the Java API framework and system apps? (Select the most complete and accurate statement)", "options": ["System apps have special kernel privileges that prevent third-party apps from replacing their functionality.", "System apps are built using the same Java framework APIs that are available to third-party developers, and developers can reuse system app functionalities.", "System apps execute directly inside the HAL without going through the Java API framework.", "The Java API framework is only accessible to Google-signed system applications."], "ans": 1, "explanation": "From the official course quiz. System apps (such as Phone, SMS, Browser) are built on top of the same Java API framework that third-party developers use. Third-party apps can also invoke system app capabilities via Intents."}, {"id": "L1Q4", "q": "Which of the following best describes a compiler compared to an interpreter?", "options": ["Translates the entire program into machine code or intermediate bytecode before execution.", "Translates code line by line and executes each statement immediately.", "Directly executes high-level source code instructions without any translation phase.", "Translates code only when runtime errors or exceptions are detected."], "ans": 0, "explanation": "Official Quiz Question. A compiler parses and translates the complete source program into machine code or target bytecode prior to execution, whereas an interpreter analyzes and executes the code line by line at runtime."}, {"id": "L1Q5", "q": "What is the primary role of the Hardware Abstraction Layer (HAL) in the Android architecture?", "options": ["To provide a standard Java interface for user interface rendering.", "To expose device hardware capabilities to the Java API framework through standardized C/C++ interfaces without exposing proprietary driver code.", "To replace the Linux kernel by handling CPU scheduling and low-level interrupts.", "To compile Java source code into DEX bytecode at runtime."], "ans": 1, "explanation": "The HAL defines standard interfaces (such as camera, audio, sensors) implemented by hardware vendors as C/C++ shared libraries (.so). This allows the upper framework layers to stay agnostic of specific proprietary driver implementations."}, {"id": "L1Q6", "q": "What is the main architectural difference between the standard Java Virtual Machine (JVM) and Dalvik/ART?", "options": ["JVM is register-based, while Dalvik/ART is stack-based.", "JVM is stack-based, while Dalvik and ART are register-based virtual execution environments designed for memory and battery efficiency.", "JVM executes .dex bytecode, while ART executes raw .class files directly.", "There is no architectural difference; ART is simply a re-branded OpenJDK JVM."], "ans": 1, "explanation": "Standard JVMs use a stack-based architecture where instructions operate on an operand stack. Dalvik and ART are register-based, which requires fewer instructions to perform operations, saves memory bandwidth, and executes significantly faster on mobile CPU architectures."}, {"id": "L1Q7", "q": "What key innovation did Heinrich Hertz contribute to the physical foundation of mobile communications in 1887?", "options": ["He formulated the four differential Maxwell equations.", "He experimentally generated and detected electromagnetic waves in a laboratory, validating Maxwell's electromagnetic theory.", "He laid the first transatlantic commercial telegraph cable.", "He invented the frequency modulation (FM) radio receiver."], "ans": 1, "explanation": "James Clerk Maxwell predicted electromagnetic waves mathematically in 1864, but Heinrich Hertz was the first to physically produce and detect them in the laboratory in 1887 using an electric spark oscillator."}, {"id": "L1Q8", "q": "Which cellular generation first introduced pure packet-switched All-IP architecture, eliminating dedicated circuit-switched voice channels?", "options": ["1G", "2G (GSM)", "3G (UMTS)", "4G (LTE)"], "ans": 3, "explanation": "4G LTE completely abandoned traditional circuit-switched telecommunication infrastructure in favor of an all-IP network. Voice calls in 4G are transported as IP packets via VoLTE (Voice over LTE)."}, {"id": "L1Q9", "q": "In the modern Android build toolchain, what is the role of the 'd8' tool?", "options": ["It converts Kotlin files directly into C++ native shared libraries.", "It is the default dexer that compiles Java .class bytecode into optimized Dalvik Executable (classes.dex) bytecode.", "It runs automated unit tests inside the Android emulator.", "It generates the AndroidManifest.xml file from Gradle configuration."], "ans": 1, "explanation": "d8 is Google's modern dex compiler (replacing the legacy dx tool). It takes Java .class bytecode files and produces optimized DEX bytecode (classes.dex) with faster compile times, smaller output size, and better desugaring support."}, {"id": "L1Q10", "q": "What is Profile-Guided Optimization (PGO) in the Android Runtime (ART)?", "options": ["Pre-compiling all apps on device purchase so JIT is permanently disabled.", "Using runtime profiling data collected during app usage to compile frequently executed 'hot' code paths into native code Ahead-Of-Time during device idle/charging.", "A security module that verifies cryptographic certificates of installed apps.", "A memory profiler inside Android Studio for tracking memory leaks."], "ans": 1, "explanation": "Starting in Android 7.0 (Nougat), ART combines JIT and AOT: when apps run, JIT profiles hot methods. When the device is idle and charging, ART compiles those hot methods into native code ahead of time, providing fast startup without slow install times."}, {"id": "L1Q11", "q": "Which layer of the Android architecture provides the Bionic C library and the SQLite database engine?", "options": ["Linux Kernel", "Hardware Abstraction Layer (HAL)", "Native C/C++ Libraries (alongside ART)", "Java API Framework"], "ans": 2, "explanation": "Bionic (Android's lightweight BSD-derived libc optimized for embedded Linux), SQLite, OpenGL ES, and WebKit/Blink reside in the Native C/C++ Libraries layer, directly alongside the Android Runtime."}, {"id": "L1Q12", "q": "Why does Android use its own custom C library, Bionic, instead of the standard GNU C Library (glibc)?", "options": ["Because glibc cannot run on ARM CPU architectures.", "Because Bionic has a much smaller memory footprint, faster lightweight thread creation, and avoids GPL licensing constraints in user space.", "Because Bionic executes Java bytecode natively without a virtual machine.", "Because glibc does not support file input/output operations."], "ans": 1, "explanation": "Bionic was engineered specifically for Android to reduce memory overhead, provide fast pthread creation on low-RAM mobile hardware, and use a BSD license so hardware and application vendors can link to it without GPL restrictions."}, {"id": "L1Q13", "q": "What constitutes the 64K method reference limit in legacy Android development, and what tool resolved it?", "options": ["A single DEX file can reference at most 65,536 methods due to a 16-bit method index; resolved by Multidex and d8.", "Android devices could only run 64 applications simultaneously; resolved by ART.", "A method could not exceed 64 kilobytes of source code; resolved by Kotlin.", "The Linux kernel can only track 65,536 process IDs; resolved by 64-bit kernels."], "ans": 0, "explanation": "In Dalvik bytecode specifications, the method reference table uses a 16-bit field ($2^{16} = 65,536$). When an app and its libraries exceed 65,536 method references, multidex is required to partition the app into multiple DEX files."}, {"id": "L1Q14", "q": "What is the primary difference between 1G and 2G mobile communication systems?", "options": ["1G used digital packet switching, while 2G used analog transmission.", "1G used analog frequency modulation for voice, while 2G introduced digital transmission, encryption, and SMS text messaging.", "1G supported video streaming, while 2G was restricted to audio only.", "1G operated on 5 GHz radio frequencies, while 2G moved down to 2.4 GHz."], "ans": 1, "explanation": "1G (e.g., AMPS) was purely analog, suffered from high background noise, and lacked encryption. 2G (e.g., GSM) introduced digital radio transmission, TDMA/CDMA multiplexing, cryptographic security, and Short Message Service (SMS)."}, {"id": "L1Q15", "q": "Which of the following components belongs to the Java API Framework layer?", "options": ["Binder Driver", "Camera HAL Module (.so)", "NotificationManager and ActivityManager", "Linux Process Scheduler"], "ans": 2, "explanation": "NotificationManager, ActivityManager, WindowManager, and ContentProviders are core high-level managers exposed as part of the Java API Framework layer in Android."}, {"id": "L1Q16", "q": "In Android's security architecture, what mechanism enforces process isolation between different installed applications?", "options": ["Each app runs in its own isolated Linux process and is assigned a unique Linux User ID (UID).", "All apps share a single common UID and rely on Java language type safety.", "Process isolation is enforced by the display driver in the HAL.", "The Google Play Store sandboxes apps remotely before download."], "ans": 0, "explanation": "Android leverages Linux multi-user security: during installation, every app is assigned a unique Linux UID and GID. The Linux kernel prevents one UID from reading another UID's process memory or private files."}, {"id": "L1Q17", "q": "Which 5G service category is specifically designed to support autonomous vehicles, remote surgery, and industrial robotics requiring sub-millisecond latency?", "options": ["eMBB (Enhanced Mobile Broadband)", "URLLC (Ultra-Reliable Low-Latency Communication)", "mMTC (Massive Machine-Type Communication)", "VoLTE (Voice over LTE)"], "ans": 1, "explanation": "URLLC provides end-to-end latency of less than 1 millisecond and 99.999% reliability, making it suitable for mission-critical applications like automated driving, telesurgery, and smart grid automation."}, {"id": "L1Q18", "q": "What is the primary function of the 'R8' tool in modern Android compilation?", "options": ["To flash ROM firmware onto rooted physical devices.", "To combine shrinking (tree-shaking/dead-code removal), optimization, obfuscation (renaming identifiers), and dexing into a single build step.", "To emulate ARM processors on x86 computers.", "To convert XML layout files into vector graphics."], "ans": 1, "explanation": "R8 is Google's code shrinker and optimizer that replaced ProGuard and integrated directly with d8. It removes unused classes/methods, optimizes bytecode, obfuscates names, and outputs classes.dex in one pass."}, {"id": "L1Q19", "q": "How does an Android app communicate with an Android system service located in another process?", "options": ["Through direct shared memory pointers without kernel intervention.", "Via Inter-Process Communication (IPC) using the Binder framework and AIDL interfaces.", "By writing temporary files to the SD card directory.", "By rebooting the device into recovery mode."], "ans": 1, "explanation": "Android's primary IPC mechanism is the Binder driver, located in the Linux kernel. System services expose remote interfaces defined in AIDL (Android Interface Definition Language), and apps make synchronous proxy calls over Binder."}, {"id": "L1Q20", "q": "Which wireless communication pioneer sent the first transatlantic radio signal across the Atlantic Ocean in 1901?", "options": ["James Clerk Maxwell", "Heinrich Hertz", "Guglielmo Marconi", "Alexander Graham Bell"], "ans": 2, "explanation": "Guglielmo Marconi successfully transmitted the Morse code signal for the letter 'S' across the Atlantic from Poldhu, Cornwall to St. John's, Newfoundland in December 1901."}]}, {"meta": {"id": 2, "title": "Signal Modulation, Gradle & Activity Lifecycle", "subtitle": "Wave physical properties, analog/digital modulation, build automation, and Android Activity states", "icon": "📡", "color": "violet"}, "summary": [{"type": "definition", "heading": "Physical Properties of Electromagnetic Waves", "body": "An electromagnetic wave is a self-propagating transverse wave consisting of oscillating electric and magnetic fields perpendicular to each other and to the direction of propagation. A sinusoidal wave is mathematically expressed as s(t) = A · sin(2πft + φ), defined by four fundamental parameters: Amplitude (A, the peak strength or power of the wave), Frequency (f, number of cycles per second measured in Hertz, Hz), Wavelength (λ, physical distance between two consecutive peaks, where c = λ · f with c ≈ 3 × 10^8 m/s), and Phase (φ, the relative shift of the wave cycle at time t = 0)."}, {"type": "comparison", "heading": "Analog Signals vs Digital Signals", "table": {"headers": ["Characteristic", "Analog Signals", "Digital Signals"], "rows": [["Nature", "Continuous waveform varying smoothly over time", "Discrete values representing binary states (0s and 1s)"], ["Noise Sensitivity", "Highly susceptible; noise accumulates with amplification", "Highly immune; noise can be filtered using threshold detectors"], ["Signal Regeneration", "Amplifiers boost both the original signal and accumulated noise", "Repeaters reconstruct and clean the exact binary pulses"], ["Bandwidth Efficiency", "Less efficient for complex multiplexing", "Highly efficient; allows advanced compression and encryption"], ["Processing Hardware", "Analog filters, operational amplifiers, inductors", "Digital Signal Processors (DSPs), microprocessors, ASICs"]]}}, {"type": "comparison", "heading": "Analog Modulation Techniques (AM, FM, PM)", "table": {"headers": ["Modulation Type", "Modulated Parameter", "Equation / Principle", "Noise Immunity", "Bandwidth & Applications"], "rows": [["Amplitude Modulation (AM)", "Carrier Amplitude", "s(t) = [A_c + m(t)] · cos(2πf_c t)", "Poor (atmospheric noise and interference distort amplitude directly)", "Narrow bandwidth (2 · B); AM broadcast radio (535-1605 kHz), aircraft radio"], ["Frequency Modulation (FM)", "Carrier Frequency", "s(t) = A_c · cos(2π[f_c + k_f · m(t)]t)", "High (noise affects amplitude, which FM receivers clip with limiters)", "Wider bandwidth (Carson's rule: 2(Δf + f_m)); FM radio (88-108 MHz), analog TV audio"], ["Phase Modulation (PM)", "Carrier Phase Angle", "s(t) = A_c · cos(2πf_c t + k_p · m(t))", "High (similar noise immunity to FM; closely related mathematically)", "Requires phase synchronization; used in telemetry, Wi-Fi, and digital foundations"]]}}, {"type": "comparison", "heading": "Digital Modulation Techniques (ASK, FSK, PSK, QAM)", "table": {"headers": ["Modulation Technique", "Parameter Varied", "Binary Representation", "Robustness & Characteristics"], "rows": [["ASK (Amplitude Shift Keying)", "Carrier amplitude", "Bit 1: high amplitude carrier; Bit 0: zero or low amplitude", "Simple hardware; very susceptible to noise and fading; low power efficiency"], ["FSK (Frequency Shift Keying)", "Carrier frequency", "Bit 1: frequency f_1; Bit 0: frequency f_2", "Constant envelope; immune to amplitude noise; requires more bandwidth than ASK"], ["PSK (Phase Shift Keying)", "Carrier phase", "Bit 1: 0° phase shift; Bit 0: 180° phase shift (BPSK)", "Excellent noise immunity; constant envelope; standard in Wi-Fi and Bluetooth"], ["QAM (Quadrature AM)", "Both amplitude and phase", "Groups of bits (e.g., 16-QAM = 4 bits/symbol, 64-QAM = 6 bits)", "Extremely high spectral efficiency; requires high Signal-to-Noise Ratio (SNR)"]]}}, {"type": "definition", "heading": "Android Build Automation with Gradle", "body": "Gradle is an advanced, declarative build automation system used by Android Studio. The build system is organized into: (1) Gradle Wrapper (gradlew / gradlew.bat), ensuring all developers and CI pipelines build with the exact same verified Gradle runtime version without manual installation; (2) Project-level build.gradle, which defines repository endpoints (google(), mavenCentral()) and buildscript plugins common to all modules; (3) Module/App-level build.gradle, which specifies the compileSdk, targetSdk, minSdkVersion, dependencies (e.g., Room, Compose), and build types (debug, release). The AndroidManifest.xml declares app metadata, activities, permissions, and intent-filters, but Gradle controls compilation parameters, dependency resolution, and versioning."}, {"type": "steps", "heading": "Android Activity Lifecycle Callback Sequence", "steps": [{"label": "1. onCreate()", "text": "Called when the activity is first created. Perform one-time static setup: inflate layouts (setContentView), bind views, initialize ViewModels, and restore savedInstanceState bundles."}, {"label": "2. onStart()", "text": "Called when the activity becomes visible to the user. The activity enters the started state, but does not yet have user focus. Ideal for registering UI-related broadcast receivers or starting location updates."}, {"label": "3. onResume()", "text": "Called when the activity enters the foreground and gains interactive user focus. The app stays in this state until focus is taken away (e.g., by a phone call or starting another activity)."}, {"label": "4. onPause()", "text": "Called when the activity loses focus and another activity enters the foreground (or a translucent dialog appears). Must execute very quickly; do NOT perform heavy database writes or network calls here."}, {"label": "5. onStop()", "text": "Called when the activity is no longer visible to the user (either covered completely by a new activity or sent to background). Release heavy resources and unregister broadcast receivers here."}, {"label": "6. onDestroy()", "text": "Called before the activity is destroyed (either finished by finish() or killed by the system for configuration changes like screen rotation). Final cleanup occurs here."}, {"label": "7. onRestart()", "text": "Called after onStop() when the activity is about to be displayed again. Followed immediately by onStart()."}]}, {"type": "rule", "heading": "Activity Lifecycle Visibility & Foreground Rules", "body": "Golden Rule 1: onStart() marks the boundary where an activity becomes VISIBLE. onResume() marks the boundary where it becomes INTERACTIVE (in the foreground). Golden Rule 2: When launching a new activity via startActivity(intent), onPause() ALWAYS executes synchronously on the current activity before the new activity can even be created or started. However, onStop() and onDestroy() may not execute immediately (or at all if killed by low memory). Golden Rule 3: All Activities must be declared in AndroidManifest.xml; Fragments are modular UI slices hosted inside an Activity and do NOT need to be declared in the manifest."}, {"type": "code", "heading": "Managing BroadcastReceivers with Lifecycle Awareness", "lang": "kotlin", "code": "class NetworkMonitorActivity : AppCompatActivity() {\n    private val connectivityReceiver = object : BroadcastReceiver() {\n        override fun onReceive(context: Context, intent: Intent) {\n            updateNetworkIndicator()\n        }\n    }\n\n    override fun onStart() {\n        super.onStart()\n        // Register receiver when screen becomes VISIBLE\n        val filter = IntentFilter(ConnectivityManager.CONNECTIVITY_ACTION)\n        registerReceiver(connectivityReceiver, filter)\n    }\n\n    override fun onStop() {\n        super.onStop()\n        // Unregister when screen is NO LONGER VISIBLE to prevent memory leaks and battery drain\n        unregisterReceiver(connectivityReceiver)\n    }\n}", "explanation": "If a feature only needs to update the UI while the screen is visible to the user, the optimal pair of lifecycle callbacks is onStart() and onStop(). Registering in onResume() and unregistering in onPause() stops updates during multi-window or partial obscuring."}], "memoryAids": [{"title": "Visibility vs Interaction Distinctions", "content": "onStart() = Screen is VISIBLE (drawn on display), but NOT interactive.\nonResume() = Screen is in FOREGROUND and INTERACTIVE (has user touch focus).\nonPause() = Screen lost focus (partially covered, dialog opened, or new activity launching).\nonStop() = Screen is COMPLETELY HIDDEN from view."}, {"title": "Activity Launch Order: Current vs New", "content": "When Activity A launches Activity B:\n1. A's onPause() runs FIRST.\n2. B's onCreate(), onStart(), and onResume() run.\n3. B is now visible and active.\n4. A's onStop() runs (only if B completely covers A)."}, {"title": "Manifest Declaration Rule", "content": "Activities -> MUST be declared in AndroidManifest.xml (<activity android:name='...'>).\nFragments -> DO NOT belong in AndroidManifest.xml; they are dynamically or statically inflated inside an Activity layout."}, {"title": "Modulation Memory Triad", "content": "AM = Changes height of carrier wave (noisy).\nFM = Changes spacing/frequency of carrier wave (noise immune, wider bandwidth).\nPM = Changes starting angle/shift of carrier wave."}], "mcqs": [{"id": "L2Q1", "q": "Which Activity lifecycle method is called when the Activity becomes visible to the user?", "options": ["onCreate", "onStart", "onResume", "onPause"], "ans": 1, "explanation": "Official Midterm Question 2 & Course Quiz. onStart() is called when the activity transitions from background to visible on the display. onResume() is called next, when the activity gains user touch focus and becomes interactive."}, {"id": "L2Q2", "q": "When launching another activity (using: val intent = Intent(this, DetailsActivity::class.java); startActivity(intent);), which statement about the current activity is correct?", "options": ["onPause() always runs, but onStop() or onDestroy() may not run immediately.", "onDestroy() always runs because a new activity starts.", "onResume() runs before the new activity starts.", "The call is synchronous, so the new activity must finish first."], "ans": 0, "explanation": "Official Midterm Question 3 & Course Quiz. When starting another activity, Android guarantees that the current activity's onPause() method completes before the new activity is created. onStop() executes only after the new activity is fully visible, and onDestroy() may not run until the back button is pressed or memory is reclaimed."}, {"id": "L2Q3", "q": "Which Activity lifecycle method is called when another activity comes into the foreground?", "options": ["onCreate", "onStart", "onResume", "onPause"], "ans": 3, "explanation": "Official Course Quiz Question. When a new activity or dialog enters the foreground, the currently active activity immediately receives onPause()."}, {"id": "L2Q4", "q": "You are building an Activity that displays a live indicator of internet connectivity. You only want to receive connectivity change broadcasts while the user is actively viewing that screen. Once the Activity is no longer visible, it should stop listening. In which lifecycle methods should you register and unregister the BroadcastReceiver?", "options": ["Register in onCreate(), unregister in onDestroy()", "Register in onResume(), unregister in onPause()", "Register in onStart(), unregister in onStop()", "Register in a background thread and unregister when the app is closed"], "ans": 2, "explanation": "Official Course Quiz Question. onStart() is invoked when the activity becomes visible, and onStop() is invoked when the activity is no longer visible to the user. Registering in onStart() and unregistering in onStop() ensures updates occur precisely during the visible window."}, {"id": "L2Q5", "q": "You implement each screen of an app (login, dashboard, settings) as a separate Fragment inside a single Activity, and you never declare any additional Activities in AndroidManifest.xml. Which of the following statements is TRUE?", "options": ["The app will crash at launch because all Fragments must be declared in the AndroidManifest.xml file.", "Each Fragment will still have its own independent lifecycle, unrelated to the Activity that hosts them.", "The Activity must still be declared in the manifest, but the Fragments do not need to be.", "Since you're using multiple Fragments, you no longer need an Activity at all."], "ans": 2, "explanation": "Official Course Quiz Question. Fragments are lightweight UI controllers hosted within an Activity. Only Activities (and Services, BroadcastReceivers, ContentProviders) require registration in AndroidManifest.xml; Fragments are managed internally by the Activity's FragmentManager."}, {"id": "L2Q6", "q": "What is the primary purpose of the Gradle Wrapper (gradlew / gradlew.bat) included in an Android project repository?", "options": ["To wrap Java source files into C++ shared libraries.", "To allow anyone to build the project using a verified, declared Gradle version without having to manually install Gradle on their operating system.", "To compress PNG drawables into WebP format.", "To sign APKs with a production release keystore automatically."], "ans": 1, "explanation": "The Gradle Wrapper ensures reproducible builds across different development machines and CI/CD servers by automatically downloading and executing the exact Gradle runtime version configured in gradle-wrapper.properties."}, {"id": "L2Q7", "q": "What is the physical relationship between wave frequency (f), wavelength (λ), and the speed of light (c) in free space?", "options": ["c = λ · f", "f = c · λ", "λ = c · f^2", "c = f / λ"], "ans": 0, "explanation": "The fundamental wave equation states that speed equals wavelength multiplied by frequency (c = λ · f). In a vacuum or air, c ≈ 3 × 10^8 m/s."}, {"id": "L2Q8", "q": "Why is Frequency Modulation (FM) significantly more resistant to natural noise and static interference than Amplitude Modulation (AM)?", "options": ["FM signals travel at twice the speed of light.", "Most electrical noise (lightning, sparks, ignition) manifests as amplitude variations, which FM receivers eliminate using amplitude limiters without altering the frequency-encoded message.", "FM waves have zero amplitude at all times.", "FM signals operate exclusively on infrared optical frequencies."], "ans": 1, "explanation": "Atmospheric and electrical interference primarily alters the amplitude of a propagating radio wave. Since an FM signal encodes the intelligence entirely in instantaneous frequency shifts, an FM receiver clips amplitude fluctuations with a limiter circuit without degrading the received message."}, {"id": "L2Q9", "q": "In digital modulation, what distinguishes Frequency Shift Keying (FSK) from Amplitude Shift Keying (ASK)?", "options": ["FSK varies the carrier frequency between two discrete values for bit 0 and bit 1, maintaining a constant amplitude envelope, whereas ASK modulates carrier amplitude.", "FSK changes the carrier phase by 180 degrees, while ASK changes frequency.", "FSK can only transmit analog audio, while ASK only transmits digital files.", "ASK requires two distinct carrier frequencies, while FSK uses only one."], "ans": 0, "explanation": "FSK alternates between two carrier frequencies ($f_1$ for '1', $f_0$ for '0') while maintaining constant amplitude envelope power. ASK represents '1' with high carrier amplitude and '0' with zero or reduced amplitude."}, {"id": "L2Q10", "q": "What happens when an Android device is rotated from portrait to landscape orientation if no special configuration handling is specified?", "options": ["The screen rotates smoothly without any lifecycle method callbacks.", "The current Activity is completely destroyed (onPause -> onStop -> onDestroy) and re-created (onCreate -> onStart -> onResume) to load alternative layout resources.", "The application terminates immediately with a runtime configuration crash.", "Only onResume() is called with the new orientation parameters."], "ans": 1, "explanation": "Screen rotation triggers a runtime configuration change. By default, Android restarts the current Activity by calling onPause(), onStop(), and onDestroy(), followed by onCreate(), onStart(), and onResume() so the app can inflate landscape-specific resources."}, {"id": "L2Q11", "q": "What is the difference between compileSdk and targetSdk in a module-level build.gradle file?", "options": ["compileSdk determines the visual theme, while targetSdk determines compiler speed.", "compileSdk specifies the Android API level against which the app is compiled at build time, while targetSdk indicates the API version against which the app has been tested for runtime behavioral changes.", "compileSdk is for Kotlin code, while targetSdk is for Java code.", "targetSdk must always be lower than minSdkVersion."], "ans": 1, "explanation": "compileSdk determines which platform APIs are available during compilation. targetSdk tells the Android OS runtime which platform behavior policies and security restrictions the app expects and has been verified to handle."}, {"id": "L2Q12", "q": "What is the primary role of Phase Shift Keying (PSK) in modern digital wireless standards such as Wi-Fi and Bluetooth?", "options": ["To increase transmission power exponentially.", "To encode digital bits by shifting the phase of the carrier sine wave at discrete symbol intervals, providing high noise resistance and constant envelope power.", "To eliminate the need for an antenna in the receiving radio.", "To convert digital pulses directly into acoustic sound waves."], "ans": 1, "explanation": "PSK (such as BPSK, QPSK, and 8-PSK) shifts the carrier wave phase by predefined angles (e.g., 0° and 180° for BPSK) to represent bits. It provides superior noise resilience compared to ASK and excellent spectral efficiency."}, {"id": "L2Q13", "q": "In which lifecycle state is an Activity considered 'partially obscured' (e.g., behind a permission prompt dialog or a semi-transparent theme)?", "options": ["Created", "Paused", "Stopped", "Destroyed"], "ans": 1, "explanation": "When an Activity is still partially visible but does not hold user focus (such as when covered by a translucent activity or dialog), it remains in the Paused state (onPause() has run, but onStop() has not)."}, {"id": "L2Q14", "q": "What is Quadrature Amplitude Modulation (QAM)?", "options": ["A modulation technique that varies both carrier amplitude and phase simultaneously, allowing multiple bits to be transmitted per symbol.", "A frequency modulation technique that uses four antennas simultaneously.", "A purely analog technique used exclusively in optical fiber lines.", "An audio compression algorithm used in MP3 encoders."], "ans": 0, "explanation": "QAM combines amplitude and phase modulation by mixing two carrier waves that are 90° out of phase (in-phase I and quadrature Q). This allows high-order constellations (e.g., 64-QAM, 256-QAM, 1024-QAM in Wi-Fi 6) carrying many bits per symbol."}, {"id": "L2Q15", "q": "Where should intensive one-time initialization, such as binding view hierarchies and setting up dependency injection, be performed in an Activity?", "options": ["In onResume()", "In onStart()", "In onCreate()", "In onPause()"], "ans": 2, "explanation": "onCreate() is guaranteed to execute only once per Activity instantiation, making it the appropriate location for inflating layouts, initializing view bindings, and setting up persistent ViewModel references."}, {"id": "L2Q16", "q": "Which file in an Android project declares app permissions (e.g., CAMERA, ACCESS_FINE_LOCATION) and registered BroadcastReceivers?", "options": ["settings.gradle", "build.gradle (Module: app)", "AndroidManifest.xml", "proguard-rules.pro"], "ans": 2, "explanation": "AndroidManifest.xml acts as the core contract between the application and the Android OS, declaring hardware requirements, permissions requested (<uses-permission>), and top-level app components."}, {"id": "L2Q17", "q": "What happens if an Activity in the Stopped state needs to be displayed to the user again?", "options": ["It calls onRestart() -> onStart() -> onResume().", "It calls onCreate() -> onResume() directly.", "It calls onPause() -> onResume().", "It cannot be displayed again and must be recreated from scratch."], "ans": 0, "explanation": "When an activity navigates back to the user from the Stopped state (without having been destroyed), the OS invokes onRestart(), followed by onStart() and onResume()."}, {"id": "L2Q18", "q": "Why is it dangerous to perform long-running blocking operations (e.g., heavy disk I/O or network calls) inside onPause()?", "options": ["Because the phone's battery will immediately discharge.", "Because the transition to the next activity is blocked until onPause() finishes, causing perceptible UI lag and potentially triggering an Application Not Responding (ANR) error.", "Because onPause() runs in a separate process that has no file system access.", "Because Android automatically cancels network sockets when onPause() begins."], "ans": 1, "explanation": "Android will not start or resume the subsequent activity until the preceding activity's onPause() callback returns. Any lengthy operation in onPause() directly degrades screen transition performance and triggers ANR dialogs."}, {"id": "L2Q19", "q": "What is the Carson's Rule used for in telecommunication engineering?", "options": ["Calculating the battery life of an Android smartphone.", "Estimating the transmission bandwidth required for a frequency-modulated (FM) signal: B_T ≈ 2(Δf + f_m).", "Calculating the number of lines of code in a Gradle build file.", "Determining the exact number of pixels in a mobile screen."], "ans": 1, "explanation": "Carson's bandwidth rule gives an empirical approximation for the bandwidth required by an FM signal: B_T ≈ 2(Δf + f_m), where Δf is the peak frequency deviation and f_m is the highest modulating signal frequency."}, {"id": "L2Q20", "q": "If the Android system is critically low on RAM and an Activity in the onStop() state needs to be evicted, how does Android reclaim memory?", "options": ["It puts the activity in an infinite loop.", "It directly terminates the activity's hosting Linux process, bypassing onDestroy() if necessary.", "It writes the entire RAM contents to external flash memory.", "It forces the user to manually uninstall an application."], "ans": 1, "explanation": "Under extreme low-memory pressure, the Android Out-Of-Memory (OOM) killer kills background processes hosting stopped activities. In this scenario, onDestroy() is never executed, and state is preserved via onSaveInstanceState()."}]}, {"meta": {"id": 3, "title": "Wireless LAN, Frequency Bands & Android Intents", "subtitle": "PAN/LAN/WAN/GAN taxonomy, IEEE 802.11 standards, 2.4 vs 5 GHz channels, and IPC via Intents", "icon": "📶", "color": "emerald"}, "summary": [{"type": "definition", "heading": "Wireless Network Classification by Geographical Scale", "body": "Wireless networks are categorized into four geographical tiers based on coverage radius, transmission power, and propagation physics: (1) PAN (Personal Area Network): Coverage < 10 meters, designed for interconnecting personal gadgets around an individual (Bluetooth, Zigbee, NFC, UWB); (2) LAN (Local Area Network / WLAN): Coverage < 100-150 meters, providing high-bandwidth wireless access within buildings, homes, or university campuses (IEEE 802.11 Wi-Fi); (3) WAN (Wide Area Network / WWAN): Coverage across cities and regions up to 100 km, utilizing cellular telecommunications (3G, 4G LTE, 5G) or WiMAX (IEEE 802.16); (4) GAN (Global Area Network): Global planetary coverage utilizing Low Earth Orbit (LEO) and geostationary satellite constellations (Starlink, Iridium, GPS)."}, {"type": "comparison", "heading": "IEEE 802.11 Wi-Fi Standards Evolution", "table": {"headers": ["Standard", "Release Year", "Frequency Band", "Max Raw Data Rate", "Modulation & Multiplexing", "Key Architectural Milestones"], "rows": [["802.11b", "1999", "2.4 GHz", "11 Mbps", "DSSS (Direct Sequence Spread Spectrum) / CCK", "First widely adopted consumer Wi-Fi standard"], ["802.11a", "1999", "5.0 GHz", "54 Mbps", "OFDM (Orthogonal Frequency Division Multiplexing)", "Higher bandwidth, free from 2.4 GHz microwave clutter, shorter indoor range"], ["802.11g", "2003", "2.4 GHz", "54 Mbps", "OFDM & DSSS backward compatible", "Brought 54 Mbps speeds to the popular 2.4 GHz band"], ["802.11n (Wi-Fi 4)", "2009", "2.4 GHz & 5.0 GHz", "Up to 600 Mbps (4x4 MIMO)", "MIMO (Multiple Input Multiple Output), 40 MHz channels", "Introduced spatial multiplexing antennas and dual-band operation"], ["802.11ac (Wi-Fi 5)", "2013", "5.0 GHz", "Up to 6.93 Gbps (8x8 MIMO)", "256-QAM, 80/160 MHz channel bonding, MU-MIMO", "Downlink Multi-User MIMO; high-density enterprise throughput"], ["802.11ax (Wi-Fi 6)", "2019", "2.4, 5.0, & 6.0 GHz (6E)", "Up to 9.6 Gbps", "1024-QAM, OFDMA, Bi-directional MU-MIMO, TWT", "OFDMA resource units; designed for massive client density and IoT power saving"]]}}, {"type": "comparison", "heading": "2.4 GHz vs 5.0 GHz Frequency Bands Comparison", "table": {"headers": ["Metric", "2.4 GHz Wi-Fi Band", "5.0 GHz Wi-Fi Band"], "rows": [["Wavelength (λ = c/f)", "≈ 12.5 cm (longer wavelength)", "≈ 6.0 cm (shorter wavelength)"], ["Indoor Propagation & Wall Penetration", "Superior penetration; bends around concrete edges and passes through drywall with lower absorption", "Inferior penetration; higher absorption by dense building materials (concrete, solid wood)"], ["Physical Reach / Coverage Range", "Extensive (up to 45-50 meters indoors)", "Limited (up to 15-20 meters indoors)"], ["Available Spectrum & Channels", "Only 3 non-overlapping 20 MHz channels (Channels 1, 6, and 11 in North America/ISM)", "At least 24 non-overlapping 20 MHz channels (UNII-1, UNII-2, UNII-3)"], ["Interference & Congestion", "Extremely congested (Bluetooth, microwave ovens, baby monitors, cordless phones share 2.4 GHz)", "Clean, low-interference spectrum with abundant channel bonding capacity"], ["Maximum Throughput", "Lower maximum data rates (limited channel bandwidth: 20/40 MHz)", "Much higher maximum data rates (channel bonding: 40, 80, and 160 MHz)"]]}}, {"type": "formula", "heading": "Wavelength, Frequency & Wave Amplitude Physics", "formula": "λ = c / f, where c = 3 × 10^8 m/s", "explanation": "For 2.4 GHz: λ = (3 × 10^8 m/s) / (2.4 × 10^9 Hz) = 0.125 m = 12.5 cm. For 5.0 GHz: λ = (3 × 10^8 m/s) / (5.0 × 10^9 Hz) = 0.06 m = 6.0 cm. Critical Rule: Wave AMPLITUDE determines the transmitted power and signal strength; amplitude is COMPLETELY INDEPENDENT of wave frequency! Two signals operating at 2.4 GHz and 5 GHz can transmit with the exact same power and amplitude."}, {"type": "definition", "heading": "Android Intents & Inter-Process Communication (IPC)", "body": "An Intent is an asynchronous messaging object used to request an action from another app component (Activities, Services, BroadcastReceivers). Intents are divided into two fundamental types: (1) Explicit Intents, which name the exact target component class (e.g., Intent(this, DetailActivity::class.java)) within the same application; and (2) Implicit Intents, which do not name a target class, but declare an abstract action (e.g., ACTION_VIEW, ACTION_SEND) and a data URI (e.g., tel:..., geo:..., content://...), allowing the Android OS to identify all registered apps on the device that can handle that request."}, {"type": "rule", "heading": "Implicit Intent Resolution & The 3 Non-Overlapping Channels Rule", "body": "Rule 1 (Implicit Intent Resolution): When an implicit intent is issued, Android matches the Intent's Action, Data URI (scheme, host, path, MIME type), and Category against the <intent-filter> tags registered in all installed apps' AndroidManifest.xml. If multiple matching apps exist, Android displays the App Chooser dialog. Rule 2 (2.4 GHz Wi-Fi Channels): In the 2.4 GHz ISM band, individual channels are spaced 5 MHz apart, but each standard 802.11 transmission requires a 20-22 MHz channel width. Consequently, only Channels 1, 6, and 11 do not overlap and can operate in the same physical space without co-channel interference."}, {"type": "code", "heading": "Kotlin Explicit vs Implicit Intent Launching", "lang": "kotlin", "code": "// 1. Explicit Intent: Launching an internal activity within the same application\nval explicitIntent = Intent(this, DetailsActivity::class.java).apply {\n    putExtra(\"ITEM_ID\", 1042)\n}\nstartActivity(explicitIntent)\n\n// 2. Implicit Intent: Viewing a PDF file with user choice of app (Drive, Adobe, etc.)\nval pdfUri: Uri = FileProvider.getUriForFile(context, \"com.app.provider\", pdfFile)\nval implicitIntent = Intent(Intent.ACTION_VIEW).apply {\n    setDataAndType(pdfUri, \"application/pdf\")\n    addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)\n}\n// Wrap in Chooser so the user can always pick their preferred reader\nval chooser = Intent.createChooser(implicitIntent, \"Open PDF with...\")\nstartActivity(chooser)\n\n// 3. Implicit Intent: Viewing a system Contact\nval contactUri = ContentUris.withAppendedId(ContactsContract.Contacts.CONTENT_URI, contactId)\nval viewContactIntent = Intent(Intent.ACTION_VIEW, contactUri)\nstartActivity(viewContactIntent)", "explanation": "Explicit intents specify the exact destination class. Implicit intents use Action + URI + MIME type, delegating resolution to the OS so users can choose between multiple capable apps."}], "memoryAids": [{"title": "The 1-6-11 Rule for 2.4 GHz Wi-Fi", "content": "Channels 1, 6, and 11 are the ONLY non-overlapping 20 MHz channels in the 2.4 GHz band. Channels 2, 3, 4, and 5 interfere with both 1 and 6!"}, {"title": "Wavelength vs Penetration Rule", "content": "Higher Frequency = Shorter Wavelength = Worse Wall Penetration.\n2.4 GHz (λ = 12.5 cm) penetrates walls and bends around obstacles.\n5.0 GHz (λ = 6.0 cm) offers higher bandwidth but is stopped easily by concrete walls."}, {"title": "Intent Golden Distinction", "content": "Explicit = Target known inside app (Class::class.java).\nImplicit = Target unknown or external (Action + Data URI + MIME type + createChooser)."}, {"title": "Frequency vs Amplitude Independence", "content": "Frequency = Number of wave cycles per second (speed of oscillation).\nAmplitude = Height of wave peak (energy and transmitted power).\nFrequency does NOT determine amplitude!"}], "mcqs": [{"id": "L3Q1", "q": "You want your app to open a PDF file located on the device. The file path is known, but you also want the user to have the choice of which app opens it (Adobe Reader, Google Drive, or other PDF viewers). Which approach is best?", "options": ["Create an explicit intent specifying the Adobe Reader package.", "Create an explicit intent for your app's internal PDF viewer.", "Use an implicit intent with ACTION_SEND and attach the PDF as an extra.", "Create an implicit intent with ACTION_VIEW and a file:// or content:// URI for the PDF."], "ans": 3, "explanation": "Official Course Quiz Question. Using an implicit intent with Intent.ACTION_VIEW and the MIME type 'application/pdf' allows the Android OS to display the system chooser containing all installed PDF viewer apps, allowing the user to select their preferred viewer."}, {"id": "L3Q2", "q": "Your app stores a contact ID that refers to a system contact. You want to show that contact's details in the system Contacts app. Which approach is correct?", "options": ["Create an explicit intent specifying the Contacts app's main activity.", "Create an implicit intent with ACTION_VIEW and a contact URI.", "Use an explicit intent targeting your app's ContactDetailsActivity.", "Send a broadcast intent with the contact URI."], "ans": 1, "explanation": "Official Course Quiz Question. System contacts are referenced by Content URIs (e.g., content://com.android.contacts/contacts/123). Launching an implicit intent with ACTION_VIEW and that URI instructs the Android OS to open the contact in the default contacts viewer."}, {"id": "L3Q3", "q": "Given the speed of light c = 3 × 10^8 m/s, what is the wavelength of a 2.4 GHz signal and a 5.0 GHz signal, and how is wave amplitude related to these frequencies?", "options": ["2.4 GHz has λ = 12.5 cm; 5 GHz has λ = 6 cm; amplitude is determined by frequency.", "2.4 GHz has λ = 12.5 cm; 5 GHz has λ = 6 cm; wave amplitude determines power and is completely independent of frequency.", "2.4 GHz has λ = 6 cm; 5 GHz has λ = 12.5 cm; amplitude decreases automatically as frequency increases.", "2.4 GHz has λ = 24 cm; 5 GHz has λ = 50 cm; amplitude is always equal to wavelength."], "ans": 1, "explanation": "Official Quiz & Midterm Physics Problem. λ = c/f. For 2.4 GHz, λ = (3×10^8) / (2.4×10^9) = 0.125 m = 12.5 cm. For 5.0 GHz, λ = (3×10^8) / (5×10^9) = 0.06 m = 6 cm. Amplitude represents the physical wave power/field strength and is independent of oscillation frequency."}, {"id": "L3Q4", "q": "In the 2.4 GHz Wi-Fi spectrum, which set of channels represents the standard non-overlapping 20 MHz channels commonly configured in multi-AP environments?", "options": ["Channels 1, 2, and 3", "Channels 1, 6, and 11", "Channels 2, 7, and 12", "Channels 1, 5, 9, and 13"], "ans": 1, "explanation": "In 2.4 GHz Wi-Fi, each 20 MHz channel spans a 22 MHz spectral mask, while channel center frequencies are spaced only 5 MHz apart. Only Channels 1, 6, and 11 have at least 25 MHz separation between their center frequencies, preventing co-channel RF interference."}, {"id": "L3Q5", "q": "Which geographical wireless category covers a personal radius of less than 10 meters and includes technologies like Bluetooth, Zigbee, and NFC?", "options": ["WLAN (Wireless Local Area Network)", "WWAN (Wireless Wide Area Network)", "WPAN (Wireless Personal Area Network)", "WGAN (Wireless Global Area Network)"], "ans": 2, "explanation": "WPAN (Wireless Personal Area Network) covers the immediate operational space around a person or device (typically up to 10 meters), focusing on low power, ad-hoc connectivity, and small data exchanges."}, {"id": "L3Q6", "q": "What happens when an app attempts to start an implicit intent for which NO installed application has a matching <intent-filter>?", "options": ["Android automatically downloads a compatible application from Google Play without asking.", "The method returns null silently and the app continues.", "An ActivityNotFoundException is thrown, causing the app to crash if unhandled.", "The Android OS reboots into safe mode."], "ans": 2, "explanation": "If startActivity() is called with an implicit intent that matches zero activities on the device, the Android OS throws an ActivityNotFoundException. Developers safeguard against this using intent.resolveActivity(packageManager) != null."}, {"id": "L3Q7", "q": "Which IEEE 802.11 standard introduced Multiple Input Multiple Output (MIMO) antenna technology and spatial multiplexing?", "options": ["802.11a", "802.11b", "802.11g", "802.11n (Wi-Fi 4)"], "ans": 3, "explanation": "IEEE 802.11n (ratified in 2009) introduced MIMO (Multiple Input Multiple Output), allowing multiple transmitters and receivers to send independent data streams simultaneously over the same radio channel, boosting speeds up to 600 Mbps."}, {"id": "L3Q8", "q": "Why does a 2.4 GHz Wi-Fi signal penetrate solid obstacles (such as brick walls and doors) better than a 5 GHz Wi-Fi signal?", "options": ["2.4 GHz signals travel at a higher speed than 5 GHz signals.", "2.4 GHz has a longer wavelength (~12.5 cm vs 6 cm), which undergoes deeper spatial diffraction around edges and excites obstacle molecules less rapidly, resulting in lower absorption loss.", "5 GHz signals are converted into sound waves inside building materials.", "2.4 GHz routers are legally allowed to broadcast at ten times higher power."], "ans": 1, "explanation": "According to EM wave physics, longer wavelengths (lower frequencies) experience less atmospheric and obstacle attenuation and diffract more effectively around obstacles compared to shorter wavelengths, which are absorbed more rapidly as heat."}, {"id": "L3Q9", "q": "What is the primary role of an <intent-filter> tag inside an Android application's AndroidManifest.xml file?", "options": ["To filter out unwanted network spam and malware.", "To inform the Android OS of the specific types of implicit intents (actions, data types, and categories) that an Activity, Service, or Receiver can handle.", "To encrypt all database tables created by Room.", "To compress the APK by filtering unused drawables."], "ans": 1, "explanation": "An <intent-filter> is a declaration in the manifest specifying the capabilities of a component: which actions it can perform, which URI data schemes and MIME types it accepts, and which intent categories it belongs to."}, {"id": "L3Q10", "q": "What is the difference between Intent Extras and Intent Data URI?", "options": ["Extras can only store integers, while Data URIs store strings.", "Data URI specifies the resource identifier (URI) that the action operates upon, whereas Extras represent a key-value Bundle containing additional arbitrary data.", "Extras are public, while Data URIs are encrypted.", "Data URIs are only used in Explicit Intents, while Extras are used in Implicit Intents."], "ans": 1, "explanation": "The Data property (setData/getData) points to the target URI being manipulated (e.g., content://contacts/people/1), while Extras (putExtra/getExtras) are arbitrary key-value pairs packaged in a Bundle providing auxiliary parameters."}, {"id": "L3Q11", "q": "Why is the 5 GHz Wi-Fi band considered advantageous for high-throughput streaming despite having a shorter range than 2.4 GHz?", "options": ["Because 5 GHz can transmit through solid lead walls.", "Because 5 GHz offers significantly wider spectral bandwidth (up to 160 MHz bonded channels) and has 24+ non-overlapping channels with far less RF interference.", "Because 5 GHz signals do not require an access point or router.", "Because 5 GHz devices consume zero electrical power."], "ans": 1, "explanation": "5 GHz has a much larger spectrum allocation, allowing 24+ non-overlapping 20 MHz channels and multi-channel bonding (40, 80, 160 MHz). It is also free from common household interference like microwave ovens and Bluetooth."}, {"id": "L3Q12", "q": "Which IEEE 802.11 standard introduced Orthogonal Frequency Division Multiple Access (OFDMA), dividing channels into Resource Units (RUs) for high-density clients?", "options": ["802.11b", "802.11g", "802.11ac (Wi-Fi 5)", "802.11ax (Wi-Fi 6)"], "ans": 3, "explanation": "Wi-Fi 6 (802.11ax) adopted OFDMA from cellular LTE/5G. OFDMA splits a Wi-Fi channel into sub-carriers grouped into Resource Units (RUs), enabling the AP to transmit to or receive from multiple clients simultaneously in a single transmission window."}, {"id": "L3Q13", "q": "When creating an implicit intent to share text or an image via social apps, which Intent Action is standard?", "options": ["Intent.ACTION_VIEW", "Intent.ACTION_EDIT", "Intent.ACTION_SEND", "Intent.ACTION_MAIN"], "ans": 2, "explanation": "Intent.ACTION_SEND is the standard Android intent action used to share data (text, URLs, photos, documents) with another application selected by the user."}, {"id": "L3Q14", "q": "What is the function of Intent.createChooser(targetIntent, title)?", "options": ["It forces Android to display a selection dialog every time, preventing the user's previously selected 'Always' default from bypassing app choice.", "It compiles the app into a chooser library.", "It crashes the app if multiple apps can handle the intent.", "It filters out third-party applications from opening the intent."], "ans": 0, "explanation": "Intent.createChooser() wraps an intent so that the Android system always displays an activity picker dialog to the user, even if the user had previously selected a 'Always use this app' preference for that action."}, {"id": "L3Q15", "q": "In 802.11 Wi-Fi, what does DSSS stand for, and which standard popularized it?", "options": ["Dynamic Single Spectrum System, in 802.11ac", "Direct Sequence Spread Spectrum, popularized in 802.11b", "Digital Signal Synchronization Standard, in 802.11a", "Data Storage Switching System, in 802.11n"], "ans": 1, "explanation": "DSSS (Direct Sequence Spread Spectrum) spreads the baseband data signal over a wider bandwidth using a chipping code (such as the 11-chip Barker sequence or CCK). It was the foundational modulation for IEEE 802.11b."}, {"id": "L3Q16", "q": "What is the category CATEGORY_DEFAULT in an intent filter?", "options": ["A category indicating the app has no security permissions.", "A category required in an <intent-filter> so that startActivity() can resolve and launch the activity with an implicit intent.", "A category that makes the activity the device home screen launcher.", "A deprecated tag that is ignored by modern Android versions."], "ans": 1, "explanation": "To receive implicit intents dispatched via startActivity(), an activity's <intent-filter> MUST include <category android:name='android.intent.category.DEFAULT'/>. If missing, startActivity() will not resolve to that activity."}, {"id": "L3Q17", "q": "Which network type connects inter-city enterprise sites across hundreds of kilometers using cellular 4G/5G or microwave towers?", "options": ["PAN", "LAN", "WAN", "BAN (Body Area Network)"], "ans": 2, "explanation": "A Wide Area Network (WAN) spans broad geographical distances (cities, regions, or countries) using telecommunications circuits, leased lines, or cellular backhauls."}, {"id": "L3Q18", "q": "In Android, how do you safely pass a custom data object between Activities inside an Intent Extra?", "options": ["Convert the object to an integer and pass its memory address.", "Have the custom object implement Parcelable (or Serializable) and put it into the Intent via putExtra().", "Save the object as a global static variable in the Linux kernel.", "Pass the raw pointer through the HAL."], "ans": 1, "explanation": "In Android, IPC bundles require data to be serialized. Android provides the Parcelable interface (highly optimized for IPC memory layout in Android) or Java Serializable to package objects into Intent extras."}, {"id": "L3Q19", "q": "What happens if two adjacent Wi-Fi Access Points are configured on Channel 1 and Channel 3 in the 2.4 GHz band?", "options": ["Their data rates double due to cooperative MIMO.", "They cause destructive adjacent-channel interference because their 20 MHz spectra overlap, increasing packet collisions and retries.", "The router on Channel 3 shuts down automatically.", "They switch to Bluetooth mode automatically."], "ans": 1, "explanation": "Since Wi-Fi channels require 20-22 MHz bandwidth and are separated by only 5 MHz, Channel 1 (2412 MHz) and Channel 3 (2422 MHz) heavily overlap. Unlike co-channel devices that can coordinate CSMA/CA, adjacent-channel interference appears as raw RF noise, severely degrading throughput."}, {"id": "L3Q20", "q": "What does URI stand for in Android Intent handling, and what are its standard components?", "options": ["Universal Radio Interface: frequency and amplitude.", "Uniform Resource Identifier: scheme, authority/host, and path (e.g., content://media/external/images/4).", "User Runtime Instruction: compiler and dexer.", "Unified Routing Index: router MAC address and IP."], "ans": 1, "explanation": "A Uniform Resource Identifier (URI) uniquely identifies a resource on Android. It consists of a scheme (e.g., content, file, http, geo, tel), authority/host, and path, enabling Android to determine which ContentProvider or app handles it."}]}, {"meta": {"id": 4, "title": "Bluetooth, FHSS & Kotlin Room Database", "subtitle": "Bluetooth Classic vs BLE, Piconets/Scatternets, Frequency Hopping Spread Spectrum, and Room persistence", "icon": "⚡", "color": "blue"}, "summary": [{"type": "comparison", "heading": "Bluetooth Classic (BR/EDR) vs Bluetooth Low Energy (BLE)", "table": {"headers": ["Architectural Metric", "Bluetooth Classic (Basic Rate / EDR)", "Bluetooth Low Energy (BLE / Bluetooth Smart)"], "rows": [["RF Channels & Spacing", "79 channels spaced 1 MHz apart (2402 - 2480 MHz)", "40 channels spaced 2 MHz apart (3 advertising, 37 data)"], ["Data Throughput", "1 Mbps (BR) to 2-3 Mbps (Enhanced Data Rate EDR)", "125 kbps (long-range coded), 1 Mbps, up to 2 Mbps"], ["Power Consumption", "High (designed for continuous active connections; 10-30 mA)", "Ultra-low (sleep-mode optimized, duty-cycled; < 10 mA peak, microamps standby)"], ["Connection Latency", "Slow connection setup (~100 ms)", "Extremely fast connection setup (< 6 ms)"], ["Primary Use Cases", "Continuous audio streaming (A2DP headsets, car audio), high-volume file transfers", "IoT sensors, heart rate monitors, beacons, smart watch fitness telemetry"], ["Dual-Mode Architecture", "Smart watches use BOTH: Classic for Bluetooth phone calls & music playback; BLE for continuous sensor telemetry & battery-saving notifications", "Standalone BLE used in coin-cell peripherals (e.g., smart tags, glucose monitors)"]]}}, {"type": "definition", "heading": "Bluetooth Network Topologies: Piconets & Scatternets", "body": "A Piconet is an ad-hoc star network formed by Bluetooth devices. Exactly one device acts as the Master, which defines the clock and the frequency-hopping channel sequence. A single Piconet can support at most 7 active Slaves simultaneously (identified by a 3-bit active member address 1-7). Up to 255 additional slave devices can remain synchronized in a low-power Parked state (Parked Member Address 8-bit). A Scatternet is formed when two or more Piconets overlap geographically; a device can participate in multiple piconets by time-multiplexing, serving as a Slave in one piconet and a Master or Slave in another piconet (a bridge node). A node can NEVER be master of two piconets simultaneously."}, {"type": "formula", "heading": "Frequency Hopping Spread Spectrum (FHSS) & Hopping Functions", "formula": "f(n) = (clock + g(n)) mod M, where M is the total number of RF channels", "explanation": "Bluetooth uses FHSS to prevent interference from Wi-Fi and microwave ovens in the 2.4 GHz band. The transmitter and receiver hop frequencies 1600 times per second (each slot is 625 microseconds). The hopping function takes the Master's free-running internal 28-bit clock and slave parameters, yielding a pseudo-random channel index. For M = 8 channels, the modulo operator ensures output channels stay bounded between 0 and 7. The spread of frequencies across the full range determines resilience against narrow-band jamming."}, {"type": "rule", "heading": "Adaptive FHSS (AFH) & The Determinism Axiom", "body": "Adaptive Frequency Hopping (AFH) monitors RF channel health and classifies channels into 'good' and 'bad' (interfered). When a hopping sequence lands on a bad channel, AFH remaps the hop to an alternate channel. Golden Exam Rule: The remapping algorithm MUST be completely DETERMINISTIC (e.g., f_remap = (ch + 1) mod 8). A random remapping strategy causes non-determinism, forcing Master and Slave out of lock-step unless complex synchronized seeds are transmitted. Determinism guarantees both ends independently calculate the exact same hopped frequency without wireless packet negotiation overhead."}, {"type": "steps", "heading": "Kotlin Room Persistence Architecture", "steps": [{"label": "1. @Entity", "text": "Annotates a Kotlin data class representing a SQLite database table. Specifies table name, primary keys (@PrimaryKey(autoGenerate = true)), column names (@ColumnInfo), and foreign key constraints (@ForeignKey)."}, {"label": "2. @Dao (Data Access Object)", "text": "Interface or abstract class defining methods to query, insert, update, and delete database records. Room verifies all SQL statements inside @Query at compile-time, eliminating runtime SQL syntax errors."}, {"label": "3. @Database", "text": "Abstract class extending RoomDatabase. Serves as the main database access point. Lists all entity classes, declares schema version, and exposes abstract getter methods returning the DAO interfaces."}, {"label": "4. Singleton Instance", "text": "Room database instances are expensive to create. Must be held in a thread-safe Singleton using @Volatile and synchronized(this) double-checked locking."}]}, {"type": "rule", "heading": "Room Foreign Key Default Constraints & Kotlin Shallow Copy Trap", "body": "Rule 1 (Room Foreign Keys): If an Entity (e.g., Order) has a @ForeignKey referencing another Entity (e.g., User), deleting a User record when associated Orders exist WITHOUT explicitly declaring onDelete behavior will FAIL with a SQLiteConstraintException. Room does NOT cascade-delete or orphan child records unless onDelete = ForeignKey.CASCADE or ForeignKey.SET_NULL is explicitly set. Rule 2 (Kotlin Shallow Copy): In Kotlin data classes, calling u1.copy() performs a SHALLOW copy: primitive values are copied by value, but object references (like mutable lists, maps, or nested objects) copy their memory reference. Mutating u2.hobbies.add('Skiing') mutates the same list referenced by u1.hobbies!"}, {"type": "code", "heading": "Kotlin Room Implementation with Null-Safety & Singleton", "lang": "kotlin", "code": "// 1. Entities with Foreign Key\n@Entity(tableName = \"users\")\ndata class User(\n    @PrimaryKey(autoGenerate = true) val userId: Long = 0,\n    val name: String,\n    val email: String? // Nullable field\n)\n\n@Entity(\n    tableName = \"orders\",\n    foreignKeys = [ForeignKey(\n        entity = User::class,\n        parentColumns = [\"userId\"],\n        childColumns = [\"userOwnerId\"],\n        onDelete = ForeignKey.CASCADE // Without this, deleting User FAILS by default!\n    )]\n)\ndata class Order(\n    @PrimaryKey(autoGenerate = true) val orderId: Long = 0,\n    val userOwnerId: Long,\n    val totalAmount: Double\n)\n\n// 2. Thread-Safe Room Singleton Database\n@Database(entities = [User::class, Order::class], version = 1)\nabstract class AppDatabase : RoomDatabase() {\n    abstract fun userDao(): UserDao\n\n    companion object {\n        @Volatile // Guarantees atomic writes visible across all CPU threads\n        private var INSTANCE: AppDatabase? = null\n\n        fun getDatabase(context: Context): AppDatabase {\n            return INSTANCE ?: synchronized(this) {\n                val instance = Room.databaseBuilder(\n                    context.applicationContext,\n                    AppDatabase::class.java,\n                    \"app_database\"\n                ).build()\n                INSTANCE = instance\n                instance\n            }\n        }\n    }\n}", "explanation": "Room provides an abstraction layer over SQLite. @Volatile guarantees that changes made by one thread to INSTANCE are immediately visible to all other threads, preventing duplicate database initialization."}], "memoryAids": [{"title": "Piconet 7-Active Limit", "content": "A Piconet has 1 Master and at most 7 ACTIVE Slaves (3-bit address). Additional 255 devices can wait in PARKED mode (8-bit address)."}, {"title": "FHSS Hopping Speed & Determinism Rule", "content": "Bluetooth Classic hops 1600 times/sec (625 µs per slot).\nAFH remapping MUST BE DETERMINISTIC (e.g., (ch+1) mod 8) so master and slave calculate the same channel without communicating."}, {"title": "Kotlin Nullable Syntax Triad", "content": "val length = name?.length // Safe-call: returns Int? or null if name is null\nval len = name!!.length   // Non-null assertion: throws NullPointerException if null\nval out = name ?: 'DEFAULT' // Elvis operator: returns 'DEFAULT' if name is null"}, {"title": "Data Class copy() Shallow Reference Trap", "content": "val u2 = u1.copy()\nIf u1 has a MutableList, u2 gets the SAME memory pointer. Adding to u2.hobbies alters u1.hobbies!"}], "mcqs": [{"id": "L4Q1", "q": "What is the correct way to access the length of a nullable String variable in Kotlin?", "options": ["println(name.length)", "println(name?.length)", "println(name!!.length)", "println(length(name))"], "ans": 1, "explanation": "Official Midterm Question 4. In Kotlin, accessing properties on a nullable reference (String?) requires the safe-call operator (name?.length). This returns the length as an Int? if name is non-null, or null safely without throwing an exception."}, {"id": "L4Q2", "q": "val name: String? = null\nval result = name?.let { it.uppercase() } ?: \"UNKNOWN\"\nprintln(result)\n\nWhat is the output?", "options": ["null", "UNKNOWN", "KOTLIN", "Throws a NullPointerException"], "ans": 1, "explanation": "Official Midterm Question 5. Since name is null, the safe-call name?.let returns null without executing the let block. The Elvis operator (?:) detects the null on its left-hand side and evaluates the right-hand fallback expression: 'UNKNOWN'."}, {"id": "L4Q3", "q": "In Room, Order has a foreign key to User. If a User with related Order records is deleted without specifying onDelete, what happens?", "options": ["The deletion fails due to the foreign key constraint.", "The Order records are automatically deleted.", "The Order records remain but become orphaned.", "Room prompts the developer to choose a behavior at runtime."], "ans": 0, "explanation": "Official Midterm Question 6 & Course Quiz. By default, SQLite and Room enforce referential integrity using NO ACTION / RESTRICT. If child records exist referencing a parent key, deleting the parent record without explicit cascading rules (onDelete = CASCADE) throws a SQLiteConstraintException and fails."}, {"id": "L4Q4", "q": "If class User has two fields, name and hobbies, then what is correct about the code below?\n\nval u1 = User(\"Sam\", mutableListOf(\"Chess\"))\nval u2 = u1.copy()\nu2.hobbies.add(\"Skiing\")", "options": ["u1.hobbies stays [\"Chess\"] (deep copy).", "u1.hobbies becomes [\"Chess\", \"Skiing\"] (shallow copy).", "u2 cannot add to hobbies since data classes are immutable.", "The code crashes due to a mutable list in a data class."], "ans": 1, "explanation": "Official Midterm Question 7. Kotlin's auto-generated data class copy() function creates a shallow copy. Primitive properties are copied, but object references (such as mutableListOf) share the exact same memory reference. Mutating u2.hobbies modifies the identical list referenced by u1."}, {"id": "L4Q5", "q": "Which type of Bluetooth does a modern smart watch use when communicating with a smartphone?", "options": ["Bluetooth Classic only", "Bluetooth Low Energy (BLE) only", "Both Bluetooth Classic and Bluetooth Low Energy (BLE / Bluetooth Blue)", "None; smart watches use Infrared"], "ans": 2, "explanation": "Official Course Quiz Question. Modern smartwatches implement dual-mode Bluetooth: BLE is used for continuous, power-efficient transmission of health metrics, sensor telemetry, and push notifications, while Bluetooth Classic is invoked for continuous high-throughput audio streaming and phone calls."}, {"id": "L4Q6", "q": "Given the frequency hopping function channel_n = (clock^2 * log(n^2)) % 7, how many distinct frequency channels are allowed to be used?", "options": ["6 channels", "7 channels (channels 0 through 6)", "8 channels", "14 channels"], "ans": 1, "explanation": "Official Course Quiz Question. The modulo operator (% 7) constrains all calculated integer outputs to the discrete set {0, 1, 2, 3, 4, 5, 6}, which represents exactly 7 allowable frequency channels."}, {"id": "L4Q7", "q": "In a Bluetooth Piconet, what is the maximum number of ACTIVE slave devices that can communicate with the master at any given time?", "options": ["3", "7", "16", "255"], "ans": 1, "explanation": "A Bluetooth piconet master addresses active slaves using a 3-bit Active Member Address (AM_ADDR), which allows at most 7 active slave devices simultaneously (addresses 1 through 7, as 0 is reserved for broadcast)."}, {"id": "L4Q8", "q": "How many parked slave devices can maintain synchronization in a Bluetooth Piconet while in low-power standby?", "options": ["Up to 7", "Up to 14", "Up to 255", "Unlimited"], "ans": 2, "explanation": "Devices in parked mode surrender their active member address and receive an 8-bit Parked
